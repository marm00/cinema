# Tutorial:

# 1. [media] tables are used to fill your media library.
#
# [media]
# directories = C:\foo, D:/bar, ~/foo, ~user/bar
# urls        = https://twitch.tv/NASA
# patterns    = E:\baz\*.png
# tags        = funny, happy
#
# If you type `tag funny`, all media is taken from here.
# Directories are recursive, urls are case-sensitive.
# Patterns support Microsoft wildcard characters, posix glob.

# 2. [layout] tables specify the number of mpv windows playing media,
# their position and size, and optionally Chatterino.
#
# [layout]
# name   = foo
# screen = 10%x10%+0+0
# screen = 480x390+0+650
# chat   = 640x945+50+50
#
# Typing `layout foo` will change the layout to this.
# Screen format: https://mpv.io/manual/stable/#options-geometry
# Chat format: [width]x[height]±[x]±[y]
# You can type `store` to write the current layout to file (update).

# 3. [macro] tables are used to do many things at once.
#
# [macro]
# name    = foo
# startup = yes
# command = layout foo, tag funny
# command = 1 search nasa, 2 mute
#
# Typing `macro foo` will execute each command, in order.
# Setting startup to `yes` will make this macro run on launch.
# On struggling hardware, you can use `idle` in between commands
# that play media to limit the amount of resources used by mpv
# (prevents trying to load files until toggled off).

# End of tutorial.

[settings]
# If mpv/ytdlp/chatterino are not found automatically, set them here and remove '#'.
# mpv        = C:\Program Files\mpv\mpv.exe
# ytdlp      = C:\Users\user\Downloads\yt-dlp.exe
# chatterino = C:\Users\user\AppData\Local\Programs\Chatterino\chatterino.exe
# If online Twitch streams fail to load, mpv cannot find yt-dlp: set it here or move
# everything together in this one folder (copy/paste the exe files next to cinema.exe).

[media]
tags = demo
urls = https://twitch.tv/AsianJeff, https://twitch.tv/Jynxzi
urls = https://twitch.tv/Caedrel,   https://twitch.tv/ardasaatci1
urls = https://twitch.tv/caseoh_,   https://twitch.tv/StRoGo
urls = https://twitch.tv/xQc,       https://twitch.tv/stableronaldo
urls = https://twitch.tv/buster,    https://twitch.tv/Trymacs
# directories = ~/Videos
# patterns    = D:\Downloads\*.mp4
# urls        = https://www.youtube.com/watch?v=...

[macro]
name    = demo
# startup = yes              # remove first '#' to run on launch
command = layout 4, tag demo
command = 2 3 4 mute         # avoid overlapping audio

