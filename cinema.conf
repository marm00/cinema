# This is the default configuration file for Cinema.
# Here is a short tutorial; real settings are at the bottom.

# 1. [media] tables are used to fill your media library.
#
# [media]
# directories = C:\foo, D:/bar
# urls = https://twitch.tv/forsen
# patterns = E:\baz\*.png
# tags = funny, happy
#
# If you type `tag funny`, all media is taken from here.
# Directories are recursive, urls are case-sensitive.
# Patterns support Microsoft wildcard characters.

# 2. [layout] tables specify the number of mpv windows playing media,
# their position and size, and optionally Chatterino.
#
# [layout]
# name = foo
# screen = 10%x10%+0+0
# screen = 480x390+0+650
# chat = 640x945+50+50
#
# Typing `layout foo` will change the layout to this.
# Screen format: https://mpv.io/manual/stable/#options-geometry
# Chat format: [width]x[height]±[x]±[y]
# You can type `store` to write the current layout to file (update).

# 3. [macro] tables are used to do many things at once.
#
# [macro]
# name = foo
# startup = yes
# command = layout foo, tag funny
# command = 1 search forsen, 2 mute
#
# Typing `macro foo` will execute each command, in order.
# Setting startup to `yes` will make this macro run on launch.
# On struggling hardware, you can use `idle` in between commands
# that play media to limit the amount of resources used by mpv.

# Real settings below, you can change everything and add anything.

[media]
urls = https://twitch.tv/forsen, https://twitch.tv/drututt
urls = https://twitch.tv/pobelter, https://twitch.tv/jackspektra
urls = https://twitch.tv/veigarv2
tags = ff15, superteam, 4 swines

[macro]
name = ff15
startup = yes
command = idle
command = layout 5
command = tag ff15
command = idle
command = 1 s forsen, 2 s drututt
command = 3 s pobelter, 4 s jackspektra
command = 5 s veigarv2
command = 2 3 4 5 mute

